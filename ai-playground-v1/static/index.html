<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Playground</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }

      body {
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
        line-height: 1.5;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 8px;
      }

      p.hint {
        color: #444;
        margin-bottom: 24px;
      }

      textarea {
        width: 100%;
        min-height: 120px;
        box-sizing: border-box;
        padding: 12px;
        font: inherit;
      }

      button {
        margin-top: 12px;
        padding: 8px 16px;
        font: inherit;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
      }

      #reply {
        margin-top: 24px;
        padding: 16px;
        background: #f4f4f4;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>AI Playground</h1>
    <p class="hint">Введите сообщение и отправьте его через backend в OpenAI API.</p>
    <form id="chat-form">
      <label for="message">Сообщение</label>
      <textarea id="message" name="message" required></textarea>
      <button type="submit" id="submit">Отправить</button>
    </form>
    <section id="reply" hidden></section>
    <script>
      const form = document.getElementById("chat-form");
      const messageInput = document.getElementById("message");
      const submitButton = document.getElementById("submit");
      const replyBox = document.getElementById("reply");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = messageInput.value.trim();
        if (!message) {
          return;
        }

        submitButton.disabled = true;
        replyBox.hidden = false;
        replyBox.textContent = "Ожидание ответа...";

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message }),
          });
          const data = await response.json();
          if (!response.ok) {
            const detail = data.detail || "Не удалось получить ответ.";
            throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
          }
          replyBox.textContent = data.reply;
        } catch (error) {
          replyBox.textContent = "Ошибка: " + error.message;
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
